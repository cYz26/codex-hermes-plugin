name: Learning validation
on:
  push:
    branches: ["main", "codex/cloud-*"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bridge:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install isolated-test dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Portable release checks
        run: |
          python -B - <<'PY'
          import re, subprocess, sys
          result = subprocess.run([sys.executable, '-B', 'scripts/check_release.py'],
                                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
          print(result.stdout, end='')
          if result.returncode:
              blocks = re.findall(r'(?:FAIL|ERROR):.*?(?=\n={20,}|\n-{20,}\nRan |\Z)',
                                  result.stdout, re.S)
              detail = ('\n'.join(blocks) if blocks else result.stdout)[-6000:]
              detail = detail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Portable release checks::' + detail)
          raise SystemExit(result.returncode)
          PY
      - name: Compile Mac receipt viewer
        if: runner.os == 'macOS'
        run: xcrun swiftc -O macos/HermesLearningNotifier.swift -o "$RUNNER_TEMP/HermesLearningNotifier"
  native:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: 2bd378ed1b8d6bf2192cb26e0a55ff3091e6bd19
          path: upstream
          persist-credentials: false
      - name: Apply pinned Learning API patch
        run: git -C upstream apply --index "$GITHUB_WORKSPACE/patches/v0.23.0/native-learning-api-v1.patch"
      - name: Build isolated native test environment
        working-directory: upstream
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-fixture
          HERMES_RUNTIME_DIR: ${{ runner.temp }}/hermes-tools
        run: python3 -B -m pm.build_env --source . --out "$RUNNER_TEMP/hermes-tests" --group dev --group test
      - name: Verify native and bridge contracts
        env:
          HERMES_TEST_PYTHON: ${{ runner.temp }}/hermes-tests/bin/python
        run: python3 -B scripts/verify_native.py --source upstream --python "$HERMES_TEST_PYTHON" --output "$RUNNER_TEMP/native-check.json"
  release:
    needs: [bridge, native]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publish the validated tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HERMES_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          tag = os.environ['HERMES_RELEASE_TAG']
          version = json.loads(Path('.codex-plugin/plugin.json').read_text())['version']
          if not re.fullmatch(r'v\d+\.\d+\.\d+', tag) or tag != 'v' + version:
              raise SystemExit('Release tag differs from the validated package version')
          if not Path('docs', f'RELEASE-{version}.zh-CN.md').is_file():
              raise SystemExit('Version-specific release notes are required')
          PY
          if gh release view "$HERMES_RELEASE_TAG" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$HERMES_RELEASE_TAG" --verify-tag \
            --title "Hermes Learning $HERMES_RELEASE_TAG" \
            --notes-file "docs/RELEASE-${HERMES_RELEASE_TAG#v}.zh-CN.md"
