[build-system]
requires = ["setuptools>=68,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-codex-learning"
version = "0.6.1"
description = "Codex hooks and a durable local bridge to Hermes native learning"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/cYz26/codex-hermes-plugin"

[project.scripts]
hermes-learning = "hermes_codex_learning.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
