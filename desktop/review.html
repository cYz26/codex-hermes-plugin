<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hermes 项目审批</title>
<style>
:root { color-scheme: light dark; font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
body { margin: 0; background: light-dark(#f5f6f8, #181a1e); color: light-dark(#20232b, #eceef2); }
main { max-width: 1100px; margin: auto; padding: 30px 22px 60px; }
h1 { font-size: 26px; margin: 0 0 6px; } h2 { font-size: 19px; margin: 0; } h3 { font-size: 15px; }
p { margin: 6px 0 16px; } .muted { opacity: .72; } .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
button { font: inherit; cursor: pointer; border: 1px solid #8590a3; border-radius: 7px; padding: 7px 13px; background: transparent; color: inherit; }
button.primary { color: white; background: #3565c6; border-color: #3565c6; } button:disabled { opacity: .4; cursor: default; }
button:not(:disabled):active { transform: translateY(1px); }
button:focus-visible, summary:focus-visible { outline: 2px solid #5382dc; outline-offset: 3px; }
.card { margin-top: 20px; padding: 20px; border-radius: 10px; background: light-dark(#fff, #23262d); border: 1px solid light-dark(#dce0e8, #3c424e); }
.badge { font-size: 12px; padding: 3px 9px; border-radius: 14px; background: light-dark(#edf1f8, #354056); }
.diff, .originals { margin: 10px 0 18px; }
.diff { border: 1px solid light-dark(#dce0e8, #3c424e); border-radius: 7px; overflow: hidden; }
.diff-header, .diff-row, .originals { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.diff-header { font-weight: 600; background: light-dark(#eef2f7, #30343d); }
.diff-header > span, .diff-mobile-label { padding: 6px 10px; }
.diff-after { border-inline-start: 1px solid light-dark(#dce0e8, #3c424e); }
.diff-line { display: grid; grid-template-columns: 3ch 1ch minmax(0, 1fr); gap: 8px; padding: 3px 9px;
  font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; background: light-dark(#f8f9fb, #1b1e24); }
.diff-line.diff-empty { background: light-dark(#eef0f4, #262a32); }
.diff-number { text-align: end; color: light-dark(#546070, #a1aaba); user-select: none; }
.diff-sign { font-weight: 700; user-select: none; }
.diff-code { min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.diff-eol { margin-inline-start: .7em; font: 11px system-ui; color: light-dark(#5a6372, #bcc6d5); }
.diff-removed { background: light-dark(#fff0ee, #3f282b); color: light-dark(#781f24, #ffd6d7); }
.diff-added { background: light-dark(#eaf7ee, #23382e); color: light-dark(#155333, #bceecf); }
.diff mark { color: inherit; border-radius: 2px; }
.diff-removed mark { background: light-dark(#fcbfba, #793b43); }
.diff-added mark { background: light-dark(#abe2b9, #335f48); }
.diff-context > summary { padding: 5px 10px; color: light-dark(#234b86, #a5c4ff); background: light-dark(#f1f5fc, #2b3446); }
.diff-context > summary:focus-visible { outline-offset: -3px; }
.diff-mobile-label { display: none; }
.originals { gap: 14px; }
.originals > div { min-width: 0; }
.review-section { margin-top: 28px; } .review-section .card { margin-top: 12px; }
.files { margin: 12px 0 18px; } .file { border-top: 1px solid light-dark(#dce0e8, #3c424e); padding: 9px 0; }
summary { cursor: pointer; overflow-wrap: anywhere; } .version { overflow-wrap: anywhere; }
pre { font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; padding: 13px; border-radius: 6px; background: light-dark(#f6f7fa, #1b1e24); min-height: 54px; }
#refresh-status { margin: 8px 0 0; min-height: 1.55em; }
#message:not(:empty) { position: fixed; z-index: 1; inset: auto 20px 20px auto; max-width: min(420px, calc(100vw - 56px));
  border: 1px solid light-dark(#b0bed2, #626f86); border-radius: 8px; box-shadow: 0 4px 18px #0003;
  background: light-dark(#fff, #252a34); padding: 11px 14px; overflow-wrap: anywhere; pointer-events: none; }
#message.success { color: light-dark(#21653d, #a0dcb2); }
#message.warning { color: light-dark(#755013, #ffcf87); }
#history, #publication-history { margin-top: 24px; } .error { color: light-dark(#a52626, #ff9696); }
@media(max-width: 700px) {
  main { padding: 22px 14px; }
  .originals { grid-template-columns: 1fr; }
  .diff-header, .diff-line.diff-empty { display: none; }
  .diff-hunk { display: flex; flex-direction: column; }
  .diff-row { display: contents; }
  .diff-mobile-label { display: block; font-size: 12px; font-weight: 600; background: light-dark(#eef2f7, #30343d); }
  .diff-mobile-label.diff-before { order: -1; }
  .diff-mobile-label.diff-after { order: 1; }
  .diff-line.diff-after { order: 2; }
  .diff-after { border-inline-start: 0; }
}
</style>
<main>
  <h1 id="review-heading">Hermes 项目审批</h1>
  <p id="project" class="muted"></p>
  <div class="row">
    <button id="refresh">刷新列表</button>
    <button id="cleanup" disabled>清理重复和过期提案</button>
    <button id="selftest">运行隔离自检</button>
    <button id="close">关闭审批会话</button>
  </div>
  <p id="refresh-status" class="muted">正在读取最新待审内容…</p>
  <div id="message" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="review-sections">
    <section id="memory-section" class="review-section">
      <h2>记忆待审</h2>
      <div id="counts" class="muted"></div>
      <div id="proposals"></div>
      <section id="history"></section>
      <section id="shared-learning-status" hidden></section>
    </section>
    <section id="publication-section" class="review-section">
      <h2>通用技能待审</h2>
      <div id="publications"></div>
      <section id="publication-history"></section>
    </section>
  </div>
</main>
<script nonce="__CSP_NONCE__">
const sessionToken = __SESSION_JSON__;
const bootstrap = __BOOTSTRAP_JSON__;
const labels = {pending: "待审", duplicate: "重复提案", stale: "原条目已变化", already_applied: "新内容已存在", unsupported: "需要原生人工审核"};
const actions = {add: "新增记忆", patch: "修订记忆", replace: "替换记忆", remove: "删除记忆"};
let current = null;
let memoryCards = new Map();
let publicationCards = new Map();
let publicationListKey;
let refreshTask = null;
let refreshTimer;
let busy = false;
let closed = false;
let trackedPublication = null;
const byId = id => document.getElementById(id);
byId("project").textContent = "项目：" + bootstrap.project;
if (bootstrap.publication_first) {
  byId("review-heading").textContent = "Hermes 跨项目共享审批";
  byId("review-sections").prepend(byId("publication-section"));
}
function node(tag, text, className) {
  const element = document.createElement(tag);
  if (text !== undefined) element.textContent = text;
  if (className) element.className = className;
  return element;
}
const diffLimits = {bytes: 128 * 1024, lines: 2000, comparisons: 250000};
const graphemes = typeof Intl.Segmenter === "function" ? new Intl.Segmenter(undefined, {granularity: "grapheme"}) : null;
const lineEnding = /(?:\r\n|\r|\n)$/;

function matchingPairs(left, right, budget, allowPartial = false) {
  let start = 0;
  let endLeft = left.length;
  let endRight = right.length;
  while (start < endLeft && start < endRight && left[start] === right[start]) start++;
  while (endLeft > start && endRight > start && left[endLeft - 1] === right[endRight - 1]) {
    endLeft--;
    endRight--;
  }
  const cost = (endLeft - start) * (endRight - start);
  if (cost > budget.remaining && !allowPartial) return null;
  const pairs = Array.from({length: start}, (_, index) => [index, index]);
  if (cost > 0 && cost <= budget.remaining) {
    budget.remaining -= cost;
    const width = endRight - start + 1;
    const lengths = new Uint16Array((endLeft - start + 1) * width);
    const offset = (i, j) => (i - start) * width + j - start;
    for (let i = endLeft - 1; i >= start; i--) {
      for (let j = endRight - 1; j >= start; j--) {
        lengths[offset(i, j)] = left[i] === right[j] ? lengths[offset(i + 1, j + 1)] + 1
          : Math.max(lengths[offset(i + 1, j)], lengths[offset(i, j + 1)]);
      }
    }
    let i = start;
    let j = start;
    while (i < endLeft && j < endRight) {
      if (left[i] === right[j]) pairs.push([i++, j++]);
      else if (lengths[offset(i + 1, j)] >= lengths[offset(i, j + 1)]) i++;
      else j++;
    }
  }
  while (endLeft < left.length) pairs.push([endLeft++, endRight++]);
  return pairs;
}

function alignLines(left, right) {
  const pairs = matchingPairs(left, right, {remaining: diffLimits.comparisons});
  if (!pairs) return null;
  const rows = [];
  let i = 0;
  let j = 0;
  for (const [nextLeft, nextRight] of [...pairs, [left.length, right.length]]) {
    while (i < nextLeft || j < nextRight) rows.push([i < nextLeft ? i++ : null, j < nextRight ? j++ : null, true]);
    if (i < left.length && j < right.length) rows.push([i++, j++, false]);
  }
  return rows;
}

function inlineParts(left, right, budget) {
  if (!graphemes || left.length + right.length > 1024) return null;
  const symbols = [left, right].map(text => {
    const tokens = [];
    for (const {segment} of graphemes.segment(text)) {
      const last = tokens.length - 1;
      if (/^\p{Decimal_Number}$/u.test(segment) && /^\p{Decimal_Number}+$/u.test(tokens[last] || "")) tokens[last] += segment;
      else tokens.push(segment);
    }
    return tokens;
  });
  const pairs = matchingPairs(...symbols, budget, true);
  return symbols.map((side, index) => {
    const same = new Set(pairs.map(pair => pair[index]));
    const parts = [];
    for (const [position, symbol] of side.entries()) {
      const changed = !same.has(position);
      const last = parts[parts.length - 1];
      if (last?.changed === changed) last.text += symbol;
      else parts.push({text: symbol, changed});
    }
    return parts;
  });
}

function diffLine(index, text, parts, changed, before, ending) {
  const side = before ? "diff-before" : "diff-after";
  if (index === null) return node("div", undefined, "diff-line diff-empty " + side);
  const state = changed ? (before ? " diff-removed" : " diff-added") : "";
  const line = node("div", undefined, "diff-line " + side + state);
  const sign = changed ? (before ? "−" : "+") : "";
  const code = node("span", parts ? undefined : text, "diff-code");
  if (parts) for (const part of parts) code.append(node(part.changed ? "mark" : "span", part.text));
  if (ending !== undefined) code.append(node("span", {"\r\n": "CRLF", "\n": "LF", "\r": "CR", "": "无行尾换行"}[ending], "diff-eol"));
  line.append(node("span", String(index + 1), "diff-number"), node("span", sign, "diff-sign"), code);
  return line;
}

function diffHunk(rows, lines, captions, budget) {
  const hunk = node("div", undefined, "diff-hunk");
  hunk.append(node("div", captions[0], "diff-mobile-label diff-before"), node("div", captions[1], "diff-mobile-label diff-after"));
  for (const [i, j, changed] of rows) {
    const oldLine = lines[0][i] ?? "";
    const newLine = lines[1][j] ?? "";
    const oldText = oldLine.replace(lineEnding, "");
    const newText = newLine.replace(lineEnding, "");
    const oldEnding = oldLine.slice(oldText.length);
    const newEnding = newLine.slice(newText.length);
    const paired = changed && i !== null && j !== null;
    const parts = paired ? inlineParts(oldText, newText, budget) : null;
    const showEnding = paired && oldEnding !== newEnding;
    const row = node("div", undefined, "diff-row");
    row.append(diffLine(i, oldText, parts?.[0], changed, true, showEnding ? oldEnding : undefined),
      diffLine(j, newText, parts?.[1], changed, false, showEnding ? newEnding : undefined));
    hunk.append(row);
  }
  return hunk;
}

function originalComparison(before, after, captions, absentLabel, emptyLabel) {
  const panel = node("details", undefined, "diff");
  const columns = node("div", undefined, "originals");
  for (const [index, text] of [before, after].entries()) {
    const column = node("div");
    column.append(node("h3", captions[index]), node("pre", text === null ? absentLabel : text || emptyLabel));
    columns.append(column);
  }
  panel.append(node("summary", "差异较长，展开完整原文对照"), columns);
  return panel;
}

function comparison(before, after, labels, absentLabel, emptyLabel) {
  const texts = [before ?? "", after ?? ""];
  const inBudget = texts[0].length + texts[1].length <= diffLimits.bytes && new TextEncoder().encode(texts.join("")).length <= diffLimits.bytes;
  const lines = inBudget ? texts.map(text => text.match(/[^\r\n]*(?:\r\n|\n|\r)|[^\r\n]+$/g) || []) : null;
  const rows = lines && lines[0].length + lines[1].length <= diffLimits.lines ? alignLines(...lines) : null;
  if (!rows) return originalComparison(before, after, labels, absentLabel, emptyLabel);
  const panel = node("div", undefined, "diff");
  const captions = [before, after].map((text, index) => labels[index] + (text === null ? " · " + absentLabel : text === "" ? " · " + emptyLabel : ""));
  const heading = node("div", undefined, "diff-header");
  heading.append(node("span", captions[0]), node("span", captions[1], "diff-after"));
  panel.append(heading);
  if (!rows.length) {
    panel.append(node("p", captions.join(" / "), "diff-mobile-label"));
    return panel;
  }
  const visible = new Array(rows.length).fill(false);
  rows.forEach(([, , changed], index) => {
    if (changed) visible.fill(true, Math.max(0, index - 3), Math.min(rows.length, index + 4));
  });
  const budget = {remaining: diffLimits.comparisons};
  let start = 0;
  while (start < rows.length) {
    let end = start + 1;
    while (end < rows.length && visible[end] === visible[start]) end++;
    const hunk = diffHunk(rows.slice(start, end), lines, captions, budget);
    if (visible[start]) panel.append(hunk);
    else {
      const context = node("details", undefined, "diff-context");
      context.append(node("summary", "展开 " + (end - start) + " 行未变内容"), hunk);
      panel.append(context);
    }
    start = end;
  }
  return panel;
}
function message(text, tone = "") {
  byId("message").textContent = text;
  byId("message").className = tone;
}
async function request(path, body) {
  const headers = {"X-Hermes-Review-Token": sessionToken};
  const options = {headers, cache: "no-store"};
  if (body !== undefined) {
    options.method = "POST";
    headers["Content-Type"] = "application/json";
    options.body = JSON.stringify(body);
  }
  const response = await fetch(path, options);
  const value = await response.json();
  if (response.status === 410) {
    closed = true;
    clearTimeout(refreshTimer);
    document.querySelectorAll("button").forEach(button => button.disabled = true);
    byId("refresh-status").textContent = value.error;
    byId("refresh-status").className = "error";
  }
  if (!response.ok || value.state === "failed") throw new Error(value.error || value.reason || "本次操作未完成");
  return value;
}
function candidates() {
  return current ? current.proposals.filter(p => ["duplicate", "stale", "already_applied"].includes(p.state)) : [];
}
function render(value) {
  if (JSON.stringify(value) === JSON.stringify(current)) return;
  current = value;
  const shared = byId("shared-learning-status");
  shared.hidden = !value.shared_learning;
  shared.replaceChildren();
  if (value.shared_learning) {
    const v = value.shared_learning;
    shared.append(node("h2", "共享学习"), node("p",
      "Codex 已提交 " + (v.contributions["Codex App"] || 0) + " 回合 · Hermes 已提交 " + (v.contributions.Hermes || 0)
      + " 回合 · 待处理 " + ((v.writes.queued || 0) + (v.writes.applying || 0))
      + " 项 · 需核对 " + ((v.writes.uncertain || 0) + (v.writes.conflict || 0)) + " 项"));
    for (const delivered of v.deliveries) {
      shared.append(node("p", delivered.executor + " 已加载 " + delivered.name + " · " + delivered.version, "muted"));
    }
    for (const item of v.published) {
      shared.append(node("p", "已发布 " + item.name + " · " + item.version, "muted"));
    }
  }
  const counts = value.counts || {};
  byId("counts").textContent = "待审 " + (counts.pending || 0) + " 项 · 重复 " + (counts.duplicate || 0)
    + " 项 · 过期或已包含 " + ((counts.stale || 0) + (counts.already_applied || 0)) + " 项";
  byId("cleanup").disabled = !candidates().length;
  const container = byId("proposals");
  const cards = new Map();
  for (const proposal of value.proposals) {
    const key = JSON.stringify(proposal);
    const saved = memoryCards.get(proposal.id);
    if (saved?.key === key) {
      cards.set(proposal.id, saved);
      continue;
    }
    const card = node("article", undefined, "card");
    const heading = node("div", undefined, "row");
    heading.append(node("h2", "提案 " + proposal.id), node("span", labels[proposal.state] || proposal.state, "badge"));
    card.append(heading, node("p", proposal.reason, "muted"));
    if (proposal.duplicate_of) card.append(node("p", "相同修改的保留提案：" + proposal.duplicate_of, "muted"));
    for (const change of proposal.operations) {
      card.append(node("h3", actions[change.action] || change.action));
      card.append(comparison(change.action === "add" ? null : change.before, change.action === "remove" ? null : change.after,
        ["当前记忆", "待审内容"], "无条目", "空内容"));
    }
    const controls = node("div", undefined, "row");
    const approve = node("button", "批准此修改", "primary");
    approve.disabled = !proposal.can_approve;
    approve.onclick = () => decide(approve, proposal, "approve");
    const reject = node("button", "丢弃提案");
    reject.disabled = !proposal.can_reject;
    reject.onclick = () => decide(reject, proposal, "reject");
    controls.append(approve, reject);
    card.append(controls);
    cards.set(proposal.id, {key, card});
  }
  const visible = Array.from(cards.values(), item => item.card);
  if (!visible.length) visible.push(node("p", "当前项目没有待审记忆修改。", "card"));
  if (visible.length !== container.children.length || visible.some((card, i) => card !== container.children[i])) {
    container.replaceChildren(...visible);
  }
  memoryCards = cards;
  const history = byId("history");
  history.replaceChildren();
  if (value.decisions && value.decisions.length) {
    history.append(node("h2", "最近处理结果"));
    for (const result of value.decisions.slice().reverse()) {
      const outcome = result.state === "approved" ? "已批准并写入" : result.state === "rejected" ? "已丢弃"
        : result.state === "approved_pending_cleanup" ? "已写入，待清理提案" : "操作未完成";
      history.append(node("p", new Date(result.at * 1000).toLocaleString() + " · " + result.pending_id + " · " + outcome));
    }
  }
}
const fileLabels = {added: "新增", removed: "删除", changed: "修改", unchanged: "未变化"};
function resource(candidate, file) {
  const panel = node("details", undefined, "file");
  const body = node("div");
  panel.append(node("summary", file.path + " · " + fileLabels[file.change]), body);
  let loaded = false;
  panel.ontoggle = async () => {
    if (!panel.open || loaded) return;
    loaded = true;
    body.replaceChildren(node("p", "正在读取已校验的文件。", "muted"));
    try {
      const params = new URLSearchParams({name: candidate.name, revision: candidate.revision, file: file.path});
      const value = await request("/api/publication-file?" + params);
      if (value.previous_unavailable) {
        body.replaceChildren(node("p", "已共享版本的文件不可用。", "error"));
        if (value.after !== null) body.append(node("pre", value.after || "（空文件）"));
      } else if (file.change === "unchanged") {
        body.replaceChildren(node("pre", value.after || "（空文件）"));
      } else {
        body.replaceChildren(comparison(value.before, value.after, ["已共享版本", "待审版本"], "无文件", "空文件"));
      }
    } catch (error) {
      loaded = false;
      body.replaceChildren(node("p", error.message + "。请刷新列表后重新核对。", "error"));
    }
  };
  panel.open = file.path === "SKILL.md" && file.change !== "unchanged";
  return panel;
}
function renderPublicationCards(candidates) {
  const key = JSON.stringify(candidates);
  if (key === publicationListKey) return;
  const cards = new Map();
  for (const candidate of candidates) {
    const explanation = candidate.reason || "请核对全部文件，确认内容可供其他项目使用。";
    const existing = publicationCards.get(candidate.revision);
    if (existing) {
      existing.reason.textContent = explanation;
      cards.set(candidate.revision, existing);
      continue;
    }
    const card = node("article", undefined, "card");
    const reason = node("p", explanation);
    card.append(node("h3", candidate.name), node("p", "待审版本 " + candidate.version, "version muted"),
      node("p", "来源项目 " + candidate.sources.join("、"), "version muted"),
      node("p", candidate.previous_version ? "对照已共享版本 " + candidate.previous_version : "首次申请共享", "version muted"),
      reason);
    const files = node("div", undefined, "files");
    files.append(...candidate.resources.map(file => resource(candidate, file)));
    const controls = node("div", undefined, "row");
    const approve = node("button", "批准跨项目共享", "primary");
    const keep = node("button", "保留在本项目");
    approve.onclick = () => decidePublication(approve, candidate, "approve_generic");
    keep.onclick = () => decidePublication(keep, candidate, "keep_project");
    controls.append(approve, keep);
    card.append(files, controls);
    cards.set(candidate.revision, {card, reason});
  }
  const container = byId("publications");
  container.replaceChildren(...(cards.size ? [...cards.values()].map(entry => entry.card) : [node("p", "当前项目没有待审的通用技能。", "muted")]));
  publicationCards = cards;
  publicationListKey = key;
}
function renderPublications(value) {
  renderPublicationCards(value.candidates);
  const history = byId("publication-history");
  history.replaceChildren();
  if (!value.decisions.length) return;
  history.append(node("h3", "最近的共享审批"));
  const outcomes = {published: "已共享", kept_in_project: "已保留在本项目", queued: "已提交，等待发布检查",
    withheld: "未通过发布检查", superseded: "候选已更新，需要审查新版本", automatic_kept: "已自动保留在本项目"};
  for (const result of value.decisions) {
    history.append(node("p", result.name + " · " + result.version + " · " + (outcomes[result.state] || result.state)
      + (result.reason ? "（" + result.reason + "）" : ""), "version muted"));
    if (trackedPublication?.name === result.name && trackedPublication.version === result.version && result.state !== "queued") {
      message(result.name + " · " + outcomes[result.state], result.state === "published" ? "success" : "warning");
      trackedPublication = null;
    }
  }
}
function scheduleRefresh() {
  clearTimeout(refreshTimer);
  if (!document.hidden && !busy && !closed) {
    refreshTimer = setTimeout(() => refresh({poll: true}), 8000);
  }
}
function refresh({poll = false, manual = false} = {}) {
  if (busy || closed) return;
  const button = byId("refresh");
  if (manual) {
    button.textContent = "正在刷新…";
    button.disabled = true;
    message("正在读取最新待审内容…");
  }
  if (refreshTask) {
    refreshTask.manual ||= manual;
    return refreshTask.done;
  }
  clearTimeout(refreshTimer);
  const status = byId("refresh-status");
  if (!poll) status.textContent = "正在读取最新待审内容…";
  const task = {manual};
  refreshTask = task;
  const show = async (path, display, target) => {
    try {
      const value = await request(path + (poll ? "?poll=1" : ""));
      if (!closed && refreshTask === task) display(value);
      return true;
    } catch (error) {
      if (refreshTask === task) {
        if (target === "proposals") {
          current = null;
          byId("cleanup").disabled = true;
          byId("counts").textContent = "";
          byId("history").replaceChildren();
        } else {
          publicationListKey = undefined;
          byId("publication-history").replaceChildren();
        }
        byId(target).replaceChildren(node("p", error.message, "error"));
      }
      return false;
    }
  };
  task.done = Promise.all([
    show("/api/proposals", render, "proposals"),
    show("/api/publications", renderPublications, "publications"),
  ]).then(results => {
    if (refreshTask !== task) return;
    refreshTask = null;
    const ok = results.every(Boolean);
    if (!closed) {
      status.textContent = ok ? "最近更新 " + new Date().toLocaleTimeString()
        : "有列表暂时读取失败。页面可见时会自动重试。";
      status.className = ok ? "muted" : "error";
    }
    if (task.manual) {
      button.textContent = "刷新列表";
      if (!closed) {
        button.disabled = false;
        message(ok ? "已刷新待审列表。" : "有列表暂时读取失败，稍后会自动重试。", ok ? "success" : "error");
      }
    }
    scheduleRefresh();
  });
  return task.done;
}
async function perform(button, working, path, body, outcome) {
  if (busy || closed) return;
  busy = true;
  trackedPublication = null;
  refreshTask = null;
  clearTimeout(refreshTimer);
  const refreshButton = byId("refresh");
  refreshButton.textContent = "刷新列表";
  refreshButton.disabled = false;
  const controls = Array.from(document.querySelectorAll("button"), control => [control, control.disabled]);
  controls.forEach(([control]) => control.disabled = true);
  const label = button.textContent;
  button.textContent = working;
  button.setAttribute("aria-busy", "true");
  message(working);
  try {
    const result = await request(path, body);
    message(...outcome(result));
  } catch (error) {
    message(error.message + "。请核对最新状态后再试。", "error");
  }
  finally {
    button.textContent = label;
    button.removeAttribute("aria-busy");
    busy = false;
    if (!closed) {
      controls.forEach(([control, disabled]) => control.disabled = disabled);
      await refresh();
    }
  }
}
function decide(button, proposal, decision) {
  const text = decision === "approve" ? "批准提案 " + proposal.id + " 并写入上方显示的修改？"
    : "丢弃提案 " + proposal.id + "？原记忆会保留。";
  if (!confirm(text)) return message("已取消，未提交决定。");
  perform(button, decision === "approve" ? "正在批准…" : "正在丢弃…", "/api/decision",
    {action: decision, id: proposal.id, revision: proposal.revision}, result => result.state === "approved" && result.applied
      ? ["提案已批准并写入记忆。", "success"] : result.state === "rejected" ? ["提案已丢弃，原记忆保留。", "success"]
      : result.applied ? ["修改已写入，提案还需要清理。", "warning"] : ["这条提案已被处理或发生变化，请核对当前状态。", "warning"]);
}
function decidePublication(button, candidate, action) {
  const approve = action === "approve_generic";
  const prompt = (approve ? "批准这个版本供其他项目使用？" : "将这个版本保留在本项目？")
    + "\n" + candidate.name + "\n" + candidate.version;
  if (!confirm(prompt)) return message("已取消，未提交决定。");
  perform(button, approve ? "正在提交批准…" : "正在保留…", "/api/decision",
    {action, name: candidate.name, revision: candidate.revision}, result => {
      if (result.state === "queued") {
        trackedPublication = {name: candidate.name, version: candidate.version};
        return ["批准已记录，等待后台完成发布检查。"];
      }
      if (result.state === "kept_in_project") return ["这个版本已保留在本项目。", "success"];
      return ["处理结果尚未确认，请核对当前状态。", "warning"];
    });
}
byId("refresh").onclick = () => refresh({manual: true});
byId("cleanup").onclick = event => {
  const rows = candidates();
  if (!rows.length) return;
  if (!confirm("丢弃以下重复、过期或已包含新内容的提案？\n" + rows.map(p => p.id).join("、") + "\n这次清理不会修改记忆。")) {
    return message("已取消清理。");
  }
  perform(event.currentTarget, "正在清理…", "/api/decision", {action: "prune", revision: current.review_revision},
    result => ["已清理 " + result.removed.length + " 项提案。" + (result.remaining ? "还可继续清理 " + result.remaining + " 项。" : ""), "success"]);
};
byId("selftest").onclick = event => perform(event.currentTarget, "正在自检…", "/api/decision", {action: "self-test"},
  result => ["隔离自检通过，共 " + result.tests + " 项。", "success"]);
byId("close").onclick = event => perform(event.currentTarget, "正在关闭…", "/api/close", {}, () => {
  closed = true;
  byId("refresh-status").textContent = "审批会话已关闭。";
  return ["审批会话已关闭，可以关闭这个页面。", "success"];
});
document.addEventListener("visibilitychange", () => {
  if (document.hidden) clearTimeout(refreshTimer);
  else refresh();
});
window.addEventListener("focus", () => {
  if (!document.hidden) refresh();
});
window.addEventListener("pageshow", event => {
  if (event.persisted) refresh();
});
window.addEventListener("pagehide", () => clearTimeout(refreshTimer));
refresh();
</script>
